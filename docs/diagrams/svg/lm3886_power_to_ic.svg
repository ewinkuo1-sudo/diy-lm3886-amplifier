ill="none" stroke="#ad5800" stroke-width="4" stroke-linejoin="round"/><rect x="540" y="670" width="200" height="155" rx="12" fill="#fff" stroke="#ad5800" stroke-width="2"/><text x="560" y="710" fill="#ad5800" font-size="28" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">~</text><text x="560" y="805" fill="#ad5800" font-size="28" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">~</text><text x="642" y="760" fill="#ad5800" font-size="29" font-weight="bold" text-anchor="middle" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">BR2</text><text x="710" y="710" fill="#ad5800" font-size="27" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">+</text><text x="710" y="805" fill="#ad5800" font-size="27" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">−</text><polyline points="740,300 1510,300" fill="none" stroke="#b73940" stroke-width="4" stroke-linejoin="round"/><polyline points="740,395 870,395 870,580" fill="none" stroke="#536978" stroke-width="4" stroke-linejoin="round"/><polyline points="740,700 870,700 870,580 1510,580" fill="none" stroke="#536978" stroke-width="4" stroke-linejoin="round"/><circle cx="870" cy="580" r="6" fill="#536978"/><text x="1525" y="625" fill="#536978" font-size="22" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">GND = BR1− 與 BR2+</text><text x="1525" y="655" fill="#536978" font-size="22" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">的 DC 中點</text><polyline points="740,795 1510,795" fill="none" stroke="#1763a6" stroke-width="4" stroke-linejoin="round"/><polyline points="1020,300 1020,405" fill="none" stroke="#b73940" stroke-width="4" stroke-linejoin="round"/><polyline points="1020,405 1020,433" fill="none" stroke="#b73940" stroke-width="4" stroke-linejoin="round"/><polyline points="1001,433 1039,433" fill="none" stroke="#b73940" stroke-width="4" stroke-linejoin="round"/><polyline points="1001,447 1039,447" fill="none" stroke="#b73940" stroke-width="4" stroke-linejoin="round"/><polyline points="1020,447 1020,475" fill="none" stroke="#b73940" stroke-width="4" stroke-linejoin="round"/><text x="1047" y="447" fill="#b73940" font-size="22" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">C201</text><text x="984" y="427" fill="#b73940" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">+</text><polyline points="1020,475 1020,580" fill="none" stroke="#b73940" stroke-width="4" stroke-linejoin="round"/><circle cx="1020" cy="300" r="6" fill="#b73940"/><circle cx="1020" cy="580" r="6" fill="#536978"/><polyline points="1020,580 1020,645" fill="none" stroke="#1763a6" stroke-width="4" stroke-linejoin="round"/><polyline points="1020,645 1020,673" fill="none" stroke="#1763a6" stroke-width="4" stroke-linejoin="round"/><polyline points="1001,673 1039,673" fill="none" stroke="#1763a6" stroke-width="4" stroke-linejoin="round"/><polyline points="1001,687 1039,687" fill="none" stroke="#1763a6" stroke-width="4" stroke-linejoin="round"/><polyline points="1020,687 1020,715" fill="none" stroke="#1763a6" stroke-width="4" stroke-linejoin="round"/><text x="1047" y="687" fill="#1763a6" font-size="22" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">C203</text><text x="984" y="667" fill="#1763a6" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">+</text><polyline points="1020,715 1020,795" fill="none" stroke="#1763a6" stroke-width="4" stroke-linejoin="round"/><circle cx="1020" cy="580" r="6" fill="#1763a6"/><circle cx="1020" cy="795" r="6" fill="#1763a6"/><polyline points="1290,300 1290,405" fill="none" stroke="#b73940" stroke-width="4" stroke-linejoin="round"/><polyline points="1290,405 1290,433" fill="none" stroke="#b73940" stroke-width="4" stroke-linejoin="round"/><polyline points="1271,433 1309,433" fill="none" stroke="#b73940" stroke-width="4" stroke-linejoin="round"/><polyline points="1271,447 1309,447" fill="none" stroke="#b73940" stroke-width="4" stroke-linejoin="round"/><polyline points="1290,447 1290,475" fill="none" stroke="#b73940" stroke-width="4" stroke-linejoin="round"/><text x="1317" y="447" fill="#b73940" font-size="22" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">C202</text><text x="1254" y="427" fill="#b73940" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">+</text><polyline points="1290,475 1290,580" fill="none" stroke="#b73940" stroke-width="4" stroke-linejoin="round"/><circle cx="1290" cy="300" r="6" fill="#b73940"/><circle cx="1290" cy="580" r="6" fill="#536978"/><polyline points="1290,580 1290,645" fill="none" stroke="#1763a6" stroke-width="4" stroke-linejoin="round"/><polyline points="1290,645 1290,673" fill="none" stroke="#1763a6" stroke-width="4" stroke-linejoin="round"/><polyline points="1271,673 1309,673" fill="none" stroke="#1763a6" stroke-width="4" stroke-linejoin="round"/><polyline points="1271,687 1309,687" fill="none" stroke="#1763a6" stroke-width="4" stroke-linejoin="round"/><polyline points="1290,687 1290,715" fill="none" stroke="#1763a6" stroke-width="4" stroke-linejoin="round"/><text x="1317" y="687" fill="#1763a6" font-size="22" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">C204</text><text x="1254" y="667" fill="#1763a6" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">+</text><polyline points="1290,715 1290,795" fill="none" stroke="#1763a6" stroke-width="4" stroke-linejoin="round"/><circle cx="1290" cy="580" r="6" fill="#1763a6"/><circle cx="1290" cy="795" r="6" fill="#1763a6"/><text x="1525" y="308" fill="#b73940" font-size="28" font-weight="bold" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">VCC</text><text x="1525" y="588" fill="#536978" font-size="28" font-weight="bold" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">GND</text><text x="1525" y="803" fill="#1763a6" font-size="28" font-weight="bold" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">VEE</text><text x="965" y="220" fill="#183447" font-size="27" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">C201–C204：各 10,000µF / 63V</text><text x="965" y="255" fill="#183447" font-size="26" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">每軌兩顆並聯 = 20,000µF</text><text x="65" y="920" fill="#ad5800" font-size="25" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">AC 次級彼此不相接；只在橋後 DC 端形成共同中點。負軌電容正端接 GND。</text><rect x="50" y="980" width="815" height="274" rx="12" fill="#fff" stroke="#1763a6" stroke-width="2"/><text x="72" y="1018" fill="#1763a6" font-size="27" font-weight="bold" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">PSU → 放大板線束</text><text x="72" y="1057" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">J203.1 → J5.1 VCC → U1/U2 pin 1、5。</text><text x="72" y="1092" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">J203.2 → J5.2 GND → U1/U2 pin 7 及各回地。</text><text x="72" y="1127" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">J203.3 → J5.3 VEE → U1/U2 pin 4。</text><text x="72" y="1162" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">兩份原理圖靠實體線束相接，同名標籤不跨檔接線。</text><text x="72" y="1197" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">R201/R202 各 2.2kΩ / 2W，分別跨正／負軌。</text><text x="72" y="1232" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">C205/C206 各 100nF / 100V，分別跨正／負軌。</text><rect x="905" y="980" width="845" height="274" rx="12" fill="#fff" stroke="#16755a" stroke-width="2"/><text x="927" y="1018" fill="#16755a" font-size="27" font-weight="bold" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">局部去耦（左聲道，右聲道編號 +100）</text><text x="927" y="1057" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">VCC–GND：C3 100nF / 100V；C7 470µF / 63V。</text><text x="927" y="1092" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">GND–VEE：C4 100nF / 100V；C6 470µF / 63V。</text><text x="927" y="1127" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">C7 正端接 VCC；C6 正端接 GND。</text><text x="927" y="1162" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">PCB V0.4：C3 跨 pin 5–7、C4 跨 pin 4–7 貼 IC 腳；</text><text x="927" y="1197" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">變體 D 底層整面接地，變體 C 各分路回 STAR。</text><text x="927" y="1232" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">GND 網名不表示各路電流應共用同一段細線。</text><rect x="50" y="1290" width="815" height="204" rx="12" fill="#fff" stroke="#7355a1" stroke-width="2"/><text x="72" y="1328" fill="#7355a1" font-size="27" font-weight="bold" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">靜音支路（左聲道）</text><text x="72" y="1367" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">pin 8 → R8 22kΩ / 0.6W → JP1 → VEE。</text><text x="72" y="1402" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">C8 100µF / 100V：正端 GND，負端 pin 8。</text><text x="72" y="1437" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">JP1 閉合 RUN；開路 MUTE。右聲道為 JP2。</text><text x="72" y="1472" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">這是板級測試跳線；自動啟停／掉電控制待設計。</text><rect x="905" y="1290" width="845" height="204" rx="12" fill="#fff" stroke="#ad5800" stroke-width="2"/><text x="927" y="1328" fill="#ad5800" font-size="27" font-weight="bold" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">供電條件與選型狀態</text><text x="927" y="1367" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">22×√2 − 2×1.1 ≈ 28.9V／軌：未扣紋波／下陷。</text><text x="927" y="1402" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">35.8V／軌是高市電空載假設，非最大電壓保證。</text><text x="927" y="1437" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">變壓器與全部 R／C 已到貨（9/22）；LM3886T 到貨未回報。</text><text x="927" y="1472" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">橋堆定案 KBPC2510 鎖機殼（未購）；保險絲、電感、接頭、浪湧控制及散熱未購。</text><rect x="50" y="1540" width="1700" height="134" rx="12" fill="#fff" stroke="#b73940" stroke-width="2"/><text x="72" y="1578" fill="#b73940" font-size="27" font-weight="bold" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">機構與整機保護</text><text x="72" y="1617" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">LM3886T 背板接 VEE，與接地機殼／散熱器間須具電氣絕緣；pin 2、6、11 為 NC。</text><text x="72" y="1652" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">保護接地 PE 的機殼連接不可由訊號 GND 替代；本圖僅次級與放大板導讀，一次側接線另行設計。</text><text x="45" y="1808" fill="#536978" font-size="21" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">四顆主電容 CDE 381LX 已到貨；橋堆定案 KBPC2510 鎖機殼但未購；未宣稱實際輸出額定。</text><text x="45" y="1840" fill="#536978" font-size="19" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">方案 C PCB V0.4  •  2026-09-24  •  工程草稿／無硬體量測  •  docs/diagrams/README.md</text></svg>