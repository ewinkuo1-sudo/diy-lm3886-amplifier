t" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">R3 1kΩ / 1%</text><polyline points="745,695 745,705" fill="none" stroke="#ad5800" stroke-width="4" stroke-linejoin="round"/><polyline points="745,705 745,733" fill="none" stroke="#ad5800" stroke-width="4" stroke-linejoin="round"/><polyline points="726,733 764,733" fill="none" stroke="#ad5800" stroke-width="4" stroke-linejoin="round"/><polyline points="726,747 764,747" fill="none" stroke="#ad5800" stroke-width="4" stroke-linejoin="round"/><polyline points="745,747 745,775" fill="none" stroke="#ad5800" stroke-width="4" stroke-linejoin="round"/><text x="772" y="747" fill="#ad5800" font-size="22" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">C2 47µF / 63V 無極性</text><polyline points="745,775 745,787" fill="none" stroke="#ad5800" stroke-width="4" stroke-linejoin="round"/><polyline points="725,787 765,787" fill="none" stroke="#ad5800" stroke-width="3" stroke-linejoin="round"/><polyline points="732,795 758,795" fill="none" stroke="#ad5800" stroke-width="3" stroke-linejoin="round"/><polyline points="739,803 751,803" fill="none" stroke="#ad5800" stroke-width="3" stroke-linejoin="round"/><polyline points="1030,300 1140,300" fill="none" stroke="#16755a" stroke-width="4" stroke-linejoin="round"/><circle cx="1140" cy="300" r="6" fill="#16755a"/><text x="1080" y="265" fill="#16755a" font-size="22" font-weight="normal" text-anchor="middle" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">至輸出級</text><rect x="70" y="620" width="550" height="169" rx="12" fill="#fff" stroke="#ad5800" stroke-width="2"/><text x="92" y="658" fill="#ad5800" font-size="27" font-weight="bold" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">回授重點</text><text x="92" y="697" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">R4 由 IC pin 3 取樣，位於 L1 之前。</text><text x="92" y="732" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">pin 9 → R3 → C2 → GND：兩者串聯。</text><text x="92" y="767" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">IC 中頻增益 21 倍；直流增益約 1 倍。</text></svg><rect x="50" y="990" width="1700" height="134" rx="12" fill="#fff" stroke="#ad5800" stroke-width="2"/><text x="72" y="1028" fill="#ad5800" font-size="27" font-weight="bold" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">讀圖重點</text><text x="72" y="1067" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">C1 隔直；R1 位於 C1 前，R2 位於 R6 後。回授 R4 接 IC 輸出，R3 與 C2 串聯到地。</text><text x="72" y="1102" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">IC 中頻增益 = 1 + 20k/1k = 21；含 R6/R2 衰減約 20.09 倍（未計前級輸出阻抗）。</text><text x="45" y="1148" fill="#536978" font-size="21" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">詳細輸出穩定網路見 IC→輸出級圖；供電與靜音見電源→IC 圖。</text><text x="45" y="1180" fill="#536978" font-size="19" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">方案 C V0.3  •  2026-09-17  •  工程草稿／無硬體量測  •  docs/diagrams/README.md</text></svg>