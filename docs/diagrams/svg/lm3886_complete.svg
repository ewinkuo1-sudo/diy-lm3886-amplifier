soft JhengHei, Noto Sans CJK TC, sans-serif">R3 1kΩ / 1%</text><polyline points="745,695 745,705" fill="none" stroke="#ad5800" stroke-width="4" stroke-linejoin="round"/><polyline points="745,705 745,733" fill="none" stroke="#ad5800" stroke-width="4" stroke-linejoin="round"/><polyline points="726,733 764,733" fill="none" stroke="#ad5800" stroke-width="4" stroke-linejoin="round"/><polyline points="726,747 764,747" fill="none" stroke="#ad5800" stroke-width="4" stroke-linejoin="round"/><polyline points="745,747 745,775" fill="none" stroke="#ad5800" stroke-width="4" stroke-linejoin="round"/><text x="772" y="747" fill="#ad5800" font-size="22" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">C2 47µF / 63V 無極性</text><polyline points="745,775 745,787" fill="none" stroke="#ad5800" stroke-width="4" stroke-linejoin="round"/><polyline points="725,787 765,787" fill="none" stroke="#ad5800" stroke-width="3" stroke-linejoin="round"/><polyline points="732,795 758,795" fill="none" stroke="#ad5800" stroke-width="3" stroke-linejoin="round"/><polyline points="739,803 751,803" fill="none" stroke="#ad5800" stroke-width="3" stroke-linejoin="round"/><polyline points="1030,300 1370,300" fill="none" stroke="#16755a" stroke-width="4" stroke-linejoin="round"/><circle cx="1140" cy="300" r="6" fill="#16755a"/><circle cx="1240" cy="300" r="6" fill="#16755a"/><polyline points="1240,300 1240,365" fill="none" stroke="#16755a" stroke-width="4" stroke-linejoin="round"/><polyline points="1240,365 1240,383" fill="none" stroke="#16755a" stroke-width="4" stroke-linejoin="round"/><rect x="1230" y="383" width="20" height="44" rx="0" fill="#fff" stroke="#16755a" stroke-width="2"/><polyline points="1240,427 1240,445" fill="none" stroke="#16755a" stroke-width="4" stroke-linejoin="round"/><text x="1264" y="412" fill="#16755a" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">R5 2.7Ω / 2W</text><polyline points="1240,445 1240,485" fill="none" stroke="#16755a" stroke-width="4" stroke-linejoin="round"/><polyline points="1240,485 1240,513" fill="none" stroke="#16755a" stroke-width="4" stroke-linejoin="round"/><polyline points="1221,513 1259,513" fill="none" stroke="#16755a" stroke-width="4" stroke-linejoin="round"/><polyline points="1221,527 1259,527" fill="none" stroke="#16755a" stroke-width="4" stroke-linejoin="round"/><polyline points="1240,527 1240,555" fill="none" stroke="#16755a" stroke-width="4" stroke-linejoin="round"/><text x="1267" y="527" fill="#16755a" font-size="22" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">C5 100nF / 100V</text><polyline points="1240,555 1240,567" fill="none" stroke="#16755a" stroke-width="4" stroke-linejoin="round"/><polyline points="1220,567 1260,567" fill="none" stroke="#16755a" stroke-width="3" stroke-linejoin="round"/><polyline points="1227,575 1253,575" fill="none" stroke="#16755a" stroke-width="3" stroke-linejoin="round"/><polyline points="1234,583 1246,583" fill="none" stroke="#16755a" stroke-width="3" stroke-linejoin="round"/><path d="M 1395 300 a 15 20 0 0 1 30 0 a 15 20 0 0 1 30 0 a 15 20 0 0 1 30 0 a 15 20 0 0 1 30 0" fill="none" stroke="#16755a" stroke-width="4"/><polyline points="1370,300 1395,300" fill="none" stroke="#16755a" stroke-width="4" stroke-linejoin="round"/><polyline points="1515,300 1660,300" fill="none" stroke="#16755a" stroke-width="4" stroke-linejoin="round"/><text x="1455" y="354" fill="#16755a" font-size="24" font-weight="normal" text-anchor="middle" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">L1 0.7µH</text><polyline points="1370,300 1370,205 1395,205" fill="none" stroke="#16755a" stroke-width="4" stroke-linejoin="round"/><polyline points="1395,205 1420,205" fill="none" stroke="#16755a" stroke-width="4" stroke-linejoin="round"/><rect x="1420" y="195" width="70" height="20" rx="0" fill="#fff" stroke="#16755a" stroke-width="2"/><polyline points="1490,205 1515,205" fill="none" stroke="#16755a" stroke-width="4" stroke-linejoin="round"/><text x="1455" y="181" fill="#16755a" font-size="23" font-weight="normal" text-anchor="middle" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">R7 10Ω / 2W</text><polyline points="1515,205 1540,205 1540,300" fill="none" stroke="#16755a" stroke-width="4" stroke-linejoin="round"/><circle cx="1370" cy="300" r="6" fill="#16755a"/><circle cx="1540" cy="300" r="6" fill="#16755a"/><text x="1570" y="265" fill="#16755a" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">J2.1 TEST OUT</text><text x="1550" y="410" fill="#16755a" font-size="26" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">8Ω 假負載</text><polyline points="1660,420 1660,438" fill="none" stroke="#16755a" stroke-width="4" stroke-linejoin="round"/><rect x="1650" y="438" width="20" height="44" rx="0" fill="#fff" stroke="#16755a" stroke-width="2"/><polyline points="1660,482 1660,500" fill="none" stroke="#16755a" stroke-width="4" stroke-linejoin="round"/><text x="1684" y="467" fill="#16755a" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif"></text><polyline points="1660,300 1660,420" fill="none" stroke="#16755a" stroke-width="4" stroke-linejoin="round"/><polyline points="1660,500 1660,560" fill="none" stroke="#16755a" stroke-width="4" stroke-linejoin="round"/><polyline points="1660,560 1660,572" fill="none" stroke="#16755a" stroke-width="4" stroke-linejoin="round"/><polyline points="1640,572 1680,572" fill="none" stroke="#16755a" stroke-width="3" stroke-linejoin="round"/><polyline points="1647,580 1673,580" fill="none" stroke="#16755a" stroke-width="3" stroke-linejoin="round"/><polyline points="1654,588 1666,588" fill="none" stroke="#16755a" stroke-width="3" stroke-linejoin="round"/><text x="1500" y="615" fill="#16755a" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">J2.2 → 負載回地</text><rect x="70" y="620" width="550" height="169" rx="12" fill="#fff" stroke="#ad5800" stroke-width="2"/><text x="92" y="658" fill="#ad5800" font-size="27" font-weight="bold" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">回授重點</text><text x="92" y="697" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">R4 由 IC pin 3 取樣，位於 L1 之前。</text><text x="92" y="732" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">pin 9 → R3 → C2 → GND：兩者串聯。</text><text x="92" y="767" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">IC 中頻增益 21 倍；直流增益約 1 倍。</text><rect x="1120" y="680" width="610" height="134" rx="12" fill="#fff" stroke="#16755a" stroke-width="2"/><text x="1142" y="718" fill="#16755a" font-size="27" font-weight="bold" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">輸出重點</text><text x="1142" y="757" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">R5 與 C5 串聯到地，是 Zobel 網路。</text><text x="1142" y="792" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">L1 與 R7 並聯後串入輸出，不是 DC 保護。</text></svg><rect x="45" y="1050" width="820" height="239" rx="12" fill="#fff" stroke="#ad5800" stroke-width="2"/><text x="67" y="1088" fill="#ad5800" font-size="27" font-weight="bold" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">共用電源：雙橋、四顆主濾波電容</text><text x="67" y="1127" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">獨立 22Vac 次級 1 → BR1：+ 接 VCC，− 接 GND。</text><text x="67" y="1162" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">獨立 22Vac 次級 2 → BR2：+ 接 GND，− 接 VEE。</text><text x="67" y="1197" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">C201/C202 接 VCC–GND；C203/C204 接 GND–VEE。</text><text x="67" y="1232" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">四顆各 10,000µF / 63V，每軌 20,000µF。</text><text x="67" y="1267" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">J203 的 1/2/3 → 放大板 J5 的 1/2/3。</text><rect x="905" y="1050" width="850" height="239" rx="12" fill="#fff" stroke="#7355a1" stroke-width="2"/><text x="927" y="1088" fill="#7355a1" font-size="27" font-weight="bold" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">供電、靜音與整機邊界</text><text x="927" y="1127" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">VCC → pin 1、5；VEE → pin 4；GND → pin 7。</text><text x="927" y="1162" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">各軌具 100nF + 470µF 局部去耦，詳電源→IC 圖。</text><text x="927" y="1197" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">pin 8 → R8 22kΩ → JP1 → VEE；C8 正端接 GND。</text><text x="927" y="1232" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">成機：TEST OUT → 待設計 DC 保護／繼電器 → 喇叭。</text><text x="927" y="1267" fill="#183447" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">約 ±30V 等級；30–40W/8Ω 為探索範圍，非額定。</text><text x="45" y="1458" fill="#536978" font-size="21" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">此圖為分區導讀；未畫出全部供電支路，完整接線以兩份 KiCad 原理圖為準。</text><text x="45" y="1490" fill="#536978" font-size="19" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">方案 C V0.3  •  2026-09-22  •  工程草稿／無硬體量測  •  docs/diagrams/README.md</text></svg>