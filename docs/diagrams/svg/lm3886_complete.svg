<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="1510" viewBox="0 0 1800 1510"><rect width="1800" height="1510" fill="#f8fafc"/><rect x="0" y="0" width="1800" height="135" rx="0" fill="#183447" stroke="#183447" stroke-width="2"/><text x="45" y="55" fill="white" font-size="38" font-weight="bold" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">LM3886｜完整電路導讀（單聲道）</text><text x="45" y="103" fill="#dbe8f0" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">雙聲道成機使用兩套相同放大電路，共用方案 C 次級電源。</text><svg x="0" y="150" width="1800" height="870" overflow="hidden" viewBox="0 0 1800 870"><rect width="1800" height="870" fill="#f8fafc"/><text x="80" y="65" fill="#183447" font-size="25" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">左聲道 U1；右聲道 U2 相同，R/C 編號加 100，L1→L2、J1/J2→J3/J4。</text><rect x="800" y="160" width="230" height="310" rx="12" fill="#fff0f0" stroke="#b73940" stroke-width="2"/><text x="915" y="217" fill="#b73940" font-size="29" font-weight="bold" text-anchor="middle" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">U1 LM3886T</text><text x="818" y="268" fill="#b73940" font-size="24" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">10  +IN</text><text x="818" y="365" fill="#b73940" font-size="24" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">9   −IN</text><text x="1008" y="309" fill="#b73940" font-size="24" font-weight="normal" text-anchor="end" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">3 OUT</text><text x="818" y="440" fill="#b73940" font-size="23" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">7 GND</text><text x="1008" y="440" fill="#b73940" font-size="23" font-weight="normal" text-anchor="end" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">4 VEE</text><text x="915" y="135" fill="#b73940" font-size="24" font-weight="normal" text-anchor="middle" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">1、5 → VCC</text><text x="915" y="500" fill="#7355a1" font-size="22" font-weight="normal" text-anchor="middle" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">8 MUTE → 見電源／靜音圖</text><polyline points="100,260 305,260" fill="none" stroke="#1763a6" stroke-width="4" stroke-linejoin="round"/><text x="80" y="210" fill="#1763a6" font-size="25" font-weight="normal" text-anchor="start" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">J1.1 RCA</text><polyline points="305,260 343,260" fill="none" stroke="#1763a6" stroke-width="4" stroke-linejoin="round"/><polyline points="343,237 343,283" fill="none" stroke="#1763a6" stroke-width="4" stroke-linejoin="round"/><polyline points="357,237 357,283" fill="none" stroke="#1763a6" stroke-width="4" stroke-linejoin="round"/><polyline points="357,260 395,260" fill="none" stroke="#1763a6" stroke-width="4" stroke-linejoin="round"/><text x="350" y="222" fill="#1763a6" font-size="23" font-weight="normal" text-anchor="middle" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">C1 2.2µF / 100V</text><polyline points="395,260 460,260" fill="none" stroke="#1763a6" stroke-width="4" stroke-linejoin="round"/><polyline points="460,260 485,260" fill="none" stroke="#1763a6" stroke-width="4" stroke-linejoin="round"/><rect x="485" y="250" width="70" height="20" rx="0" fill="#fff" stroke="#1763a6" stroke-width="2"/><polyline points="555,260 580,260" fill="none" stroke="#1763a6" stroke-width="4" stroke-linejoin="round"/><text x="520" y="236" fill="#1763a6" font-size="23" font-weight="normal" text-anchor="middle" font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif">R6 1kΩ</text><polyline points="580,260 800,260" fill="none" stroke="#1763a6" stroke-